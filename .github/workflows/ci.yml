name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci        # src/ folder ke andar jaake
        working-directory: ./src
      - run: npm run build
        working-directory: ./src
      - run: npx eslint .
        working-directory: ./src

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: ./backend
      # agar tests hain:
      # - run: pytest
      #   working-directory: ./backend
