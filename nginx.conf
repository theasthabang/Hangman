server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / client-side routing fallback — any path that
    # doesn't match a real file (e.g. a deep link) falls back to
    # index.html so the app's own router can handle it, instead of
    # nginx returning a 404 for routes that only exist client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}